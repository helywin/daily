<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f6f8">
  <script>
    (() => {
      const storageKey = 'daily-theme';
      let savedTheme = null;
      try { savedTheme = localStorage.getItem(storageKey); } catch (_) {}
      const theme = savedTheme === 'light' || savedTheme === 'dark'
        ? savedTheme
        : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0b1120' : '#f4f6f8';
    })();
  </script>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/post-toc.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">R</span>
        <span>
          <strong>{{ site.title }}</strong>
          <small>SLAM · Control · AI Coding</small>
        </span>
      </a>
      <div class="header-actions">
        <nav>
          <a href="{{ '/' | relative_url }}">首页</a>
          <a href="{{ '/search/' | relative_url }}">搜索</a>
          <a href="{{ '/archive/' | relative_url }}">归档</a>
          <a href="{{ '/about/' | relative_url }}">关于</a>
          <a href="https://github.com/helywin/daily">GitHub</a>
        </nav>
        <button class="theme-toggle" type="button" aria-label="切换到暗色模式" title="切换到暗色模式">
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.7 15.1A9 9 0 0 1 8.9 3.3 9 9 0 1 0 20.7 15.1Z"></path>
          </svg>
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3.5"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="shell">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <span>© {{ site.time | date: '%Y' }} {{ site.title }}</span>
      <span>由 Jekyll 与 GitHub Pages 构建</span>
    </div>
  </footer>
</body>
</html>
