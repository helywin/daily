<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#111827">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">R</span>
        <span>
          <strong>{{ site.title }}</strong>
          <small>SLAM · Control · AI Coding</small>
        </span>
      </a>
      <nav>
        <a href="{{ '/' | relative_url }}">首页</a>
        <a href="{{ '/archive/' | relative_url }}">归档</a>
        <a href="{{ '/about/' | relative_url }}">关于</a>
        <a href="https://github.com/helywin/daily">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="shell">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <span>© {{ site.time | date: '%Y' }} {{ site.title }}</span>
      <span>由 Jekyll 与 GitHub Pages 构建</span>
    </div>
  </footer>
</body>
</html>
