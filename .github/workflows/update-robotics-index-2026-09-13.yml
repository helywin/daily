name: Update robotics brief index 2026-09-13

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-robotics-index-2026-09-13.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update coverage index
        env:
          UPDATE_SCRIPT_B64: ""
        run: python -c "import base64,os; exec(base64.b64decode(os.environ['UPDATE_SCRIPT_B64']).decode())"
      - name: Commit index and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robotics-brief-covered-items.md
          git rm .github/workflows/update-robotics-index-2026-09-13.yml
          git commit -m "docs: update robotics brief coverage index for 2026-09-13"
          git push
