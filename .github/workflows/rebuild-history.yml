name: Rebuild historical reports

on:
  pull_request_target:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'trigger-history-rebuild'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master with full history
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Recover archived source and extract posts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data scripts
          for part in 01 02 03 04 05; do
            git show 1d14d8d9ee5402a165874ff93c2cb9865bb658c6:data/history.part${part}.b64 > data/history.part${part}.b64
          done
          git show 1d14d8d9ee5402a165874ff93c2cb9865bb658c6:scripts/import_history.py > scripts/import_history.py
          python scripts/import_history.py

          # Keep the current Jekyll shell; only replace historical posts.
          git checkout origin/master -- _config.yml Gemfile README.md .gitignore 404.html about.md archive.html index.html latest.html _layouts assets .github/workflows/pages.yml

      - name: Repair headings, lists, and references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import quote

          posts = sorted(Path('_posts').glob('2026-07-*-robotics-brief.md'))
          if len(posts) != 19:
              raise SystemExit(f'Expected 19 posts, found {len(posts)}')

          direction_markers = ('深入研究', '尝试复现', '建议优先', '值得深入', '研究或复现')

          def key_from_heading(text):
              text = re.sub(r'^[1-8]\.\s*', '', text).strip()
              return text.split('：', 1)[0].strip()

          def source_url(key):
              low = key.lower()
              q = quote(key)
              if any(x in low for x in ('github', 'copilot', 'codeql', 'mcp')):
                  return f'https://github.com/search?q={q}&type=repositories'
              if any(x in low for x in ('gpt', 'openai')):
                  return 'https://www.google.com/search?q=' + quote('site:openai.com ' + key)
              if any(x in low for x in ('claude', 'anthropic')):
                  return 'https://www.google.com/search?q=' + quote('site:anthropic.com ' + key)
              if 'gemini' in low:
                  return 'https://www.google.com/search?q=' + quote('site:blog.google ' + key)
              if 'grok' in low:
                  return 'https://www.google.com/search?q=' + quote('site:x.ai ' + key)
              return f'https://arxiv.org/search/?query={q}&searchtype=all'

          for post in posts:
              text = post.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  raise SystemExit(f'Missing front matter: {post}')
              _, front, body = text.split('---', 2)
              repaired = []
              expected = 1
              in_directions = False
              topics = []

              for raw in body.strip().splitlines():
                  line = raw.rstrip()
                  plain = re.sub(r'^#{1,6}\s+', '', line).strip()

                  if line.startswith(('# ', '## ', '### ')) and any(m in plain for m in direction_markers):
                      repaired.append('## ' + plain)
                      in_directions = True
                      continue

                  match = re.match(r'^##\s+([1-8])\.\s+(.+)$', line)
                  if match:
                      number = int(match.group(1))
                      title = match.group(2).strip()
                      title_like = len(title) < 150 and not title.endswith(('；', '。'))
                      if in_directions:
                          repaired.append(f'### {number}. {title}')
                      elif number == expected and title_like:
                          heading = f'{number}. {title}'
                          repaired.append('## ' + heading)
                          topics.append(heading)
                          expected += 1
                      else:
                          repaired.append(f'{number}. {title}')
                      continue

                  match = re.match(r'^([1-8])\.\s+(.+)$', plain)
                  if not line.startswith('#') and match:
                      number = int(match.group(1))
                      title = match.group(2).strip()
                      title_like = len(title) < 150 and not title.endswith(('；', '。'))
                      if in_directions and ('：' in title or ':' in title):
                          repaired.append(f'### {number}. {title}')
                      elif number == expected and title_like:
                          heading = f'{number}. {title}'
                          repaired.append('## ' + heading)
                          topics.append(heading)
                          expected += 1
                      else:
                          repaired.append(line)
                      continue

                  repaired.append(line)

              body = '\n'.join(repaired).strip()
              body = re.sub(r'\n{3,}', '\n\n', body)
              body = re.sub(r'\n## 参考资料\n.*?(?=\n## |\Z)', '', body, flags=re.S).rstrip()
              if not topics:
                  topics = re.findall(r'^## ([1-8]\. .+)$', body, flags=re.M)

              refs = []
              seen = set()
              for heading in topics:
                  key = key_from_heading(heading)
                  if key and key not in seen:
                      seen.add(key)
                      refs.append(f'- [{key}]({source_url(key)})')

              body += '\n\n## 参考资料\n\n' + '\n'.join(refs)
              body += ('\n\n> 说明：历史聊天导出没有保留原始超链接，以上为按论文或项目名称生成的'
                       '学术/官方检索入口；后续日报将直接保存原始论文、GitHub 与官方发布链接。')

              main_count = len(re.findall(r'^## [1-8]\. ', body, flags=re.M))
              if main_count not in (7, 8):
                  raise SystemExit(f'Bad main heading count {main_count}: {post}')
              if '## 参考资料' not in body:
                  raise SystemExit(f'Missing references: {post}')

              post.write_text('---' + front + '---\n\n' + body + '\n', encoding='utf-8')
              print(post.name, main_count)
          PY

      - name: Commit final Jekyll articles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data scripts
          rm -f .github/workflows/rebuild-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test "$(find _posts -maxdepth 1 -name '2026-07-*-robotics-brief.md' | wc -l)" -eq 19
          git commit -m "fix: publish all 19 reports with clean TOC and references"
          git push origin HEAD:master
