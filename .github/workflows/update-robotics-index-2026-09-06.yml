name: Update robotics brief coverage index 2026-09-06

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-robotics-index-2026-09-06.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Update coverage index
        env:
          ROWS_B64: ''
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os
          p = Path('robotics-brief-covered-items.md')
          s = p.read_text(encoding='utf-8')
          if '| 2026-09-06 | AutoCompass:' in s:
              raise SystemExit('2026-09-06 entries already present; refusing duplicate append')
          old_head = '> 最后更新：2026-09-05（Asia/Shanghai）'
          new_head = '> 最后更新：2026-09-06（Asia/Shanghai）'
          if old_head not in s:
              raise SystemExit('expected previous header not found')
          s = s.replace(old_head, new_head, 1)
          old_stat = '> 2026-09-05 新增 8 条主动态与 1 条经典论文回顾，共 514 条。'
          new_stat = old_stat + '\n>\n> 2026-09-06 新增 8 条主动态与 1 条经典论文回顾，共 523 条。'
          if old_stat not in s:
              raise SystemExit('expected previous statistics line not found')
          s = s.replace(old_stat, new_stat, 1)
          marker = '\n## 维护检查表'
          if marker not in s:
              raise SystemExit('maintenance checklist marker not found')
          rows = base64.b64decode(os.environ['ROWS_B64']).decode('utf-8').rstrip() + '\n'
          s = s.replace(marker, '\n' + rows + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/update-robotics-index-2026-09-06.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add robotics-brief-covered-items.md .github/workflows/update-robotics-index-2026-09-06.yml
          git commit -m 'docs: update robotics brief coverage index for 2026-09-06'
          git push origin master
