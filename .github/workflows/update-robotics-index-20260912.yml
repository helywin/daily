name: Update robotics brief coverage index 2026-09-12

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/update-robotics-index-20260912.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update index
        run: |
          echo '' | base64 -d | python3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: update robotics brief coverage index for 2026-09-12"
          git push origin master
