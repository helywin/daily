name: Update Robotics Brief Index 20260828
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-robotics-index-20260828.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Patch index
        env:
          ROWS_B64: 
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, base64
          p = Path('robotics-brief-covered-items.md')
          s = p.read_text()
          old = '> 最后更新：2026-08-27（Asia/Shanghai）'
          new = '> 最后更新：2026-08-28（Asia/Shanghai）'
          if new not in s:
              if old not in s:
                  raise SystemExit('unexpected index header')
              s = s.replace(old, new, 1)
          note = '> 2026-08-27 新增 8 条主动态与 1 条经典论文回顾，共 433 条。'
          newnote = note + '\n>\n> 2026-08-28 新增 8 条主动态与 1 条经典论文回顾，共 442 条。'
          if '2026-08-28 新增 8 条主动态与 1 条经典论文回顾，共 442 条。' not in s:
              if note not in s:
                  raise SystemExit('unexpected index history note')
              s = s.replace(note, newnote, 1)
          rows = base64.b64decode(os.environ['ROWS_B64']).decode()
          marker = '\n## 维护检查表'
          if marker not in s:
              raise SystemExit('maintenance marker missing')
          if '2608.25135' not in s:
              s = s.replace(marker, '\n' + rows + '\n' + marker, 1)
          p.write_text(s)
          PY
      - name: Commit index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add robotics-brief-covered-items.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: update robotics brief coverage index for 2026-08-28'
          git push origin HEAD:master
# trigger after workflow creation
