name: Update robotics brief index 2026-08-18

on:
  push:
    paths:
      - '.github/workflows/update-robotics-index-20260818.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Update coverage index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('robotics-brief-covered-items.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('> 最后更新：2026-08-17（Asia/Shanghai）', '> 最后更新：2026-08-18（Asia/Shanghai）', 1)
          anchor = '> 2026-08-17 新增 8 条主动态与 1 条经典论文回顾，共 343 条。'
          note = anchor + '\n>\n> 2026-08-18 新增 8 条主动态与 1 条经典论文回顾，共 352 条。'
          if '2026-08-18 新增 8 条主动态' not in s:
              if anchor not in s:
                  raise SystemExit('header anchor not found')
              s = s.replace(anchor, note, 1)
          rows = '''| 2026-08-18 | Reflex: Enabling Fast and Predictive Vision-Language-Action Models for Reaction-Critical Manipulation / ReflexVLA | [论文](https://arxiv.org/abs/2608.14379) · [项目页](https://reflexvla.github.io/) | 时间回补；反应关键 VLA、显式延迟评测与未来预测 |\n| 2026-08-18 | AgilePE: Autonomous UAV Pursuit-Evasion via Self-Play Reinforcement Learning | [论文](https://arxiv.org/abs/2608.14135) | 时间回补；CTBR 端到端控制、PFSP 与硬件对齐 sim-to-real |\n| 2026-08-18 | PILOT: Privileged Imitation Learning for End-to-End Motion Planning of Autonomous UAVs under Partial Observability | [论文](https://arxiv.org/abs/2608.14082) · [项目页](https://qr-zhang.github.io/PILOT/) | 时间回补；优化控制教师蒸馏、历史深度与结构化轨迹 |\n| 2026-08-18 | AdvDex: Learning Dexterous Manipulation from Human Demonstrations via Joint-Aligned Actions and Adversarial Learning | [论文](https://arxiv.org/abs/2608.14028) | 时间回补；OmniShare、JAAS 跨本体动作对齐与域对抗 |\n| 2026-08-18 | PRM-as-a-Judge 1.5: A Toolkit for Robot Process Assessment | [论文](https://arxiv.org/abs/2608.14284) | 时间回补；机器人过程进度曲线、FNS/DRR/SQS 与 RoboPulse++ |\n| 2026-08-18 | CORAL: Curriculum-Optimized Reward Adaptation for LiDAR-Based Goal-Directed Urban Driving | [论文](https://arxiv.org/abs/2608.14332) | 时间回补；五阶段课程 + stage-aware reward；LiDAR 消融需谨慎解释 |\n| 2026-08-18 | Vero: Can AI Agents Build Formally Verified Software Repositories? | [论文](https://arxiv.org/abs/2608.13522) · [代码与评测](https://github.com/sunblaze-ucb/vero) | 时间回补；多模块 Lean 4 仓库级代码+证明联合生成 |\n| 2026-08-18 | Engineering Reliable Coding Agents: Evaluating and Operating the System Around the Model | [论文](https://arxiv.org/abs/2608.13867) | 时间回补；Coding Agent 系统可靠性、harness/状态/权限/验证 |\n| 2026-08-18 | OKVIS: Keyframe-Based Visual-Inertial SLAM using Nonlinear Optimization | [RSS](https://www.roboticsproceedings.org/rss09/p37.html) · [官方代码](https://github.com/ethz-asl/okvis) | 经典论文回顾 |\n\n'''
          if '| 2026-08-18 | Reflex:' not in s:
              marker = '## 维护检查表'
              if marker not in s:
                  raise SystemExit('maintenance marker not found')
              s = s.replace(marker, rows + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/update-robotics-index-20260818.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add robotics-brief-covered-items.md .github/workflows/update-robotics-index-20260818.yml
          git commit -m 'docs: update robotics brief coverage index for 2026-08-18'
          git push origin HEAD:master
