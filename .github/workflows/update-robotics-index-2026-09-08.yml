name: Update robotics brief index 2026-09-08

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-robotics-index-2026-09-08.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update coverage index
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit index update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: update robotics brief coverage index for 2026-09-08"
          git push origin HEAD:master
