name: Update robotics brief coverage index for 2026-09-20

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-index-2026-09-20.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch coverage index
        run: python .github/scripts/update-index-2026-09-20.py
      - name: Commit coverage index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robotics-brief-covered-items.md
          git commit -m "docs: update robotics brief coverage index for 2026-09-20"
      - name: Remove temporary updater files
        run: |
          rm -f .github/scripts/update-index-2026-09-20.py
          rm -f .github/workflows/update-index-2026-09-20.yml
          git add -A
          git commit -m "chore: remove temporary robotics brief index updater for 2026-09-20"
      - name: Push commits
        run: git push origin HEAD:master
