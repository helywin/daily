name: Update Robotics Brief Index 2026-09-09

on:
  push:
    paths:
      - '.github/workflows/update-robotics-index-2026-09-09.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Update coverage index and remove one-shot workflow
        env:
          ROWS_B64: ""
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os

          p = Path('robotics-brief-covered-items.md')
          s = p.read_text(encoding='utf-8')
          rows = base64.b64decode(os.environ['ROWS_B64']).decode('utf-8')

          old_date = '> 最后更新：2026-09-08（Asia/Shanghai）'
          new_date = '> 最后更新：2026-09-09（Asia/Shanghai）'
          old_stat = '> 2026-09-08 新增 8 条主动态与 1 条经典论文回顾，共 549 条。'
          new_stat = '> 2026-09-09 新增 8 条主动态与 1 条经典论文回顾，共 558 条。'
          checklist = '\n## 维护检查表\n'

          assert old_date in s, 'expected old header date not found'
          assert old_stat in s, 'expected 2026-09-08 stats line not found'
          assert checklist in s, 'maintenance checklist not found'
          assert '2609.04411' not in s, 'AquaBEV already indexed'
          assert '2609.05300' not in s, 'H2INT already indexed'
          assert '2609.05161' not in s, 'APEX-RBD already indexed'
          assert '2609.04921' not in s, 'diffusion planner already indexed'
          assert '2609.04799' not in s, 'HaptiNet already indexed'
          assert '2609.05178' not in s, 'LIBERO-RECOVER already indexed'
          assert 'research-acceleration-view-inside-openai' not in s, 'OpenAI research acceleration already indexed'
          assert '2609.04909' not in s, 'APR hallucination already indexed'
          assert 'CHOMP: Gradient Optimization Techniques' not in s, 'CHOMP already indexed'

          s = s.replace(old_date, new_date, 1)
          s = s.replace(old_stat, old_stat + '\n>\n' + new_stat, 1)
          s = s.replace(checklist, '\n' + rows + checklist, 1)
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robotics-brief-covered-items.md
          git rm .github/workflows/update-robotics-index-2026-09-09.yml
          git commit -m "docs: update robotics brief coverage index for 2026-09-09"
          git push origin HEAD:master
