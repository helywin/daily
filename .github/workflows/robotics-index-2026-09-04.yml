name: robotics-index-2026-09-04

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/robotics-index-2026-09-04.yml

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Update coverage index
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit index and remove updater
        shell: bash
        run: |
          rm .github/workflows/robotics-index-2026-09-04.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add robotics-brief-covered-items.md .github/workflows/robotics-index-2026-09-04.yml
          git commit -m 'docs: update robotics brief coverage index for 2026-09-04'
          git push origin HEAD:master
