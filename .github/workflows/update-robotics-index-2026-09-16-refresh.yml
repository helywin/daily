name: Refresh robotics brief index 2026-09-16

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-robotics-index-2026-09-16-refresh.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update coverage index
        run: python .github/scripts/update_robotics_index_2026_09_16_refresh.py

      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robotics-brief-covered-items.md
          git commit -m "docs: update robotics brief coverage index for 2026-09-16"

      - name: Remove temporary updater files
        run: |
          rm -f .github/scripts/update_robotics_index_2026_09_16_refresh.py
          rm -f .github/workflows/update-robotics-index-2026-09-16-refresh.yml
          git add -A
          git commit -m "chore: remove temporary robotics index updater"

      - name: Push commits
        run: git push origin HEAD:master
