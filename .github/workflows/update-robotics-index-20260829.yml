name: Update robotics brief index 2026-08-29

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/update-robotics-index-20260829.yml"

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Update coverage index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("robotics-brief-covered-items.md")
          text = path.read_text(encoding="utf-8")

          # Header date.
          text = re.sub(
              r"> 最后更新：\d{4}-\d{2}-\d{2}（Asia/Shanghai）",
              "> 最后更新：2026-08-29（Asia/Shanghai）",
              text,
              count=1,
          )

          # Daily count note, inserted before the verified-items table.
          daily_note = "> 2026-08-29 新增 8 条主动态与 1 条经典论文回顾，共 451 条。"
          if daily_note not in text:
              marker = "\n## 已核验条目"
              if marker not in text:
                  raise RuntimeError("missing verified-items marker")
              before, after = text.split(marker, 1)
              before = before.rstrip() + "\n>\n" + daily_note + "\n"
              text = before + marker + after

          rows = """| 2026-08-29 | Online Joint Calibration of Steering Offset and Planar LiDAR Extrinsics for Wheeled Mobile Robots | [论文](https://arxiv.org/abs/2608.26789) | 时间回补；WMR 在线联合估计转向零偏与平面 LiDAR 外参。 |
          | 2026-08-29 | Contact-Aided Factor-Graph Localization for Underwater Sampling | [论文](https://arxiv.org/abs/2608.26932) | 时间回补；将机械接触作为高置信定位因子。 |
          | 2026-08-29 | Dispersive Forward Tree Search for Optimal Control: Coverage, Complexity, and Computation | [论文](https://arxiv.org/abs/2608.26314) | 时间回补；DFT*，传播式近最优动力学规划与并行实现。 |
          | 2026-08-29 | SOLO: Stable Omni-terrain Long-Horizon Perceptive Humanoid Locomotion | [论文](https://arxiv.org/abs/2608.26583) | 时间回补；查询式地形重建与轨迹感知蒸馏。 |
          | 2026-08-29 | Rapid On-Robot Learning for Dynamic Manipulation Skills: Robot Juggling | [论文](https://arxiv.org/abs/2608.26800) | 时间回补；局部真机学习与 Mutually Reachable Set。 |
          | 2026-08-29 | RTNav: Towards Real-Time Zero-Shot Object Navigation | [论文](https://arxiv.org/abs/2608.26496) | 时间回补；异步、墙钟时间感知的零样本目标导航。 |
          | 2026-08-29 | DeepRepro: State-Aware Subplanning for Paper-to-Code Reproduction in Evolving Repositories | [论文](https://arxiv.org/abs/2608.26557) | 时间回补；基于实时仓库状态的动态子规划。 |
          | 2026-08-29 | FaultLens: Learning Compact Behavioral Test Suites for Generated Operational Programs | [论文](https://arxiv.org/abs/2608.26746) | 时间回补；从历史执行证据学习紧凑行为测试集。 |
          | 2026-08-29 | Unified Temporal and Spatial Calibration for Multi-Sensor Systems (Kalibr) | [DOI](https://doi.org/10.1109/IROS.2013.6696514) | 经典论文回顾；联合时空标定与连续时间批估计。 |
          """

          first_key = "| 2026-08-29 | Online Joint Calibration of Steering Offset"
          if first_key not in text:
              marker = "\n## 维护检查表"
              if marker not in text:
                  raise RuntimeError("missing maintenance checklist marker")
              text = text.replace(marker, "\n" + rows.rstrip() + "\n" + marker, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robotics-brief-covered-items.md
          if git diff --cached --quiet; then
            echo "Index already up to date"
            exit 0
          fi
          git commit -m "docs: update robotics brief coverage index for 2026-08-29"
          git push origin master
