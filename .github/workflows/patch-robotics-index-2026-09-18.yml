name: Patch robotics brief index 2026-09-18

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch coverage index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('robotics-brief-covered-items.md')
          text = path.read_text(encoding='utf-8')

          old_date = '> 最后更新：2026-09-17（Asia/Shanghai）'
          new_date = '> 最后更新：2026-09-18（Asia/Shanghai）'
          timeline_anchor = '> 2026-09-17 早间首版新增 8 条主动态、1 条经典论文回顾与 3 条社区精选，共 669 条；随后因 arXiv 9 月 17 日最新公开批次刷新，更新同日文章并追加 8 条主动态、1 条经典论文回顾与 2 条社区精选，累计共 680 条。早间首版条目保留为历史覆盖记录。'
          timeline_new = '> 2026-09-18 新增 7 条主动态、1 条经典论文回顾与 2 条社区精选，共 690 条。'
          marker = '\n## 维护检查表\n'

          rows = '''
| 2026-09-18 | rMuscle: Robotic Muscle Memory for Efficient Vision-Language-Action Model Inference | [论文](https://arxiv.org/abs/2609.19104) | 时间回补；v1 2026-09-16；Context Cache + Action Cache；RTX 4090 / Jetson Thor 1.29–1.42× VLA 推理加速 |
| 2026-09-18 | CaSCo: Cascade-Aware Soft-Collision Motion Planning | [论文](https://arxiv.org/abs/2609.18910) | 时间回补；v1 2026-09-16；语义对象风险 + 物理级联碰撞；扩展 roadmap state 与最优图搜索 |
| 2026-09-18 | Asymptotically Optimal Multi-Robot Task and Motion Planning | [论文](https://arxiv.org/abs/2609.18813) | 时间回补；v1 2026-09-16；transition coverage + individual roadmaps + implicit tensor-product search |
| 2026-09-18 | DynoFluxBench: Benchmarking Kinodynamic Space-Time Planners in Dynamic Environments | [论文](https://arxiv.org/abs/2609.18549) · [项目页](https://dynofluxbench.github.io/) | 时间回补；v1 2026-09-16；ST-Db-RRT / ST-GBRRT / KIST 动态环境 kinodynamic benchmark |
| 2026-09-18 | VLM-MPPI: Grounding Natural Language in Behaviorally Diverse Trajectories for Aerial Navigation | [论文](https://arxiv.org/abs/2609.18451) | 时间回补；v1 2026-09-16；6× behavior-conditioned MPPI + 异步 VLM 候选选择；20 Hz 重规划 |
| 2026-09-18 | KINO: A Keyframe Interface for VLM Planning and Whole-Body Control in Humanoid Loco-Manipulation | [论文](https://arxiv.org/abs/2609.18869) | 时间回补；v1 2026-09-16；motion keyframe 连接 VLM 与 Whole-Body RL；Unitree G1 |
| 2026-09-18 | PASSAGE: Scaling Scene-Aligned Motion Learning for Perceptive Humanoid Traversal in Cluttered Environments | [论文](https://arxiv.org/abs/2609.18732) | 时间回补；v1 2026-09-16；100 h / 1,500 scene-aligned motions；6.25 Hz planner + 50 Hz tracker |
| 2026-09-18 | 社区精选：Plugin4Shell 与 Coding Agent 插件供应链校验 | [AIR Security](https://www.air.security/blog-posts/plugin4shell) | 社区精选；2026-09-17；SHA pinning checkout 后需验证实际 HEAD；Agent 插件按高权限供应链管理 |
| 2026-09-18 | 社区精选：多 Agent 的 Coordination Tax 与低并发委派 | [The Decoder](https://the-decoder.com/ai-agent-swarms-are-a-massive-waste-of-tokens-with-zero-quality-gain-says-openai-codex-developer/) | 社区精选；2026-09-17；Codex 开发者实践观点；减少状态轮询、重复验证与子 Agent 重复工具调用 |
| 2026-09-18 | A Unified Approach for Motion and Force Control of Robot Manipulators: The Operational Space Formulation | [Stanford Robotics Lab](https://khatib.stanford.edu/publications.html) · [论文 PDF](https://khatib.stanford.edu/publications/pdfs/Khatib_1987_RA.pdf) · [DOI](https://doi.org/10.1109/JRA.1987.1087068) | 经典论文回顾；Khatib，1987；task-space inertia、dynamically consistent inverse 与 null-space control |
'''

          if new_date in text and '| 2026-09-18 | rMuscle:' in text:
              print('Index already patched; no changes needed.')
          else:
              if old_date not in text:
                  raise SystemExit('Expected previous last-update marker not found')
              if timeline_anchor not in text:
                  raise SystemExit('Expected 2026-09-17 timeline anchor not found')
              if marker not in text:
                  raise SystemExit('Maintenance checklist marker not found')
              text = text.replace(old_date, new_date, 1)
              text = text.replace(timeline_anchor, timeline_anchor + '\n>\n' + timeline_new, 1)
              text = text.replace(marker, '\n' + rows.rstrip() + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
              print('Index patched successfully.')
          PY

      - name: Verify index patch
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '> 最后更新：2026-09-18（Asia/Shanghai）' robotics-brief-covered-items.md
          grep -Fq '> 2026-09-18 新增 7 条主动态、1 条经典论文回顾与 2 条社区精选，共 690 条。' robotics-brief-covered-items.md
          test "$(grep -c '^| 2026-09-18 |' robotics-brief-covered-items.md)" -eq 10
          grep -Fq '## 维护检查表' robotics-brief-covered-items.md

      - name: Commit index and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/patch-robotics-index-2026-09-18.yml
          git add robotics-brief-covered-items.md .github/workflows/patch-robotics-index-2026-09-18.yml
          git commit -m 'docs: update robotics brief coverage index for 2026-09-18'
          git push origin HEAD:master
