name: Update Robotics Index 2026-09-10

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/update-robotics-index-2026-09-10.yml"

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update coverage index
        shell: bash
        run: |
          python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit index and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-robotics-index-2026-09-10.yml
          git add robotics-brief-covered-items.md
          git commit -m "docs: update robotics brief coverage index for 2026-09-10"
          git push
