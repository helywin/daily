name: Update Robotics Brief Index 2026-08-20

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-robotics-index-2026-08-20.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update coverage index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('robotics-brief-covered-items.md')
          text = p.read_text(encoding='utf-8')
          old_date = '> 最后更新：2026-08-19（Asia/Shanghai）'
          new_date = '> 最后更新：2026-08-20（Asia/Shanghai）'
          assert old_date in text, 'unexpected index header date'
          text = text.replace(old_date, new_date, 1)

          old_note = '> 2026-08-19 新增 8 条主动态与 1 条经典论文回顾，共 361 条。'
          new_note = old_note + '\n>\n> 2026-08-20 新增 8 条主动态与 1 条经典论文回顾，共 370 条。'
          assert old_note in text, 'missing previous count note'
          text = text.replace(old_note, new_note, 1)

          rows = '''| 2026-08-20 | Hydra-0: Action Flow as a Universal Action Representation for Video World Models | [论文](https://arxiv.org/abs/2608.14862) · [项目页](https://nvidia-isaac.github.io/video_to_data/hydra-0/) | 时间回补；v1 2026-08-18；跨本体 action flow 世界模型 |
| 2026-08-20 | PRISM: A Multi-Modal Industrial Manipulation Dataset | [论文](https://arxiv.org/abs/2608.14769) · [项目页](https://prism-dataset.github.io/) | 时间回补；v1 2026-08-18；工业多模态操作数据 |
| 2026-08-20 | Jetson-ORB-SLAM3 | [论文](https://arxiv.org/abs/2608.14720) | 时间回补；v1 2026-08-18；Jetson GPU ORB 与 TensorRT 回环 |
| 2026-08-20 | Effector-Centric NMPC for Aerial Manipulation | [论文](https://arxiv.org/abs/2608.14694) | 时间回补；v1 2026-08-18；100 Hz 可倾转多旋翼末端 NMPC |
| 2026-08-20 | Agent Lightning v1.0 | [论文](https://arxiv.org/abs/2608.14473) · [代码](https://github.com/microsoft/agent-lightning) | 时间回补；v1 2026-08-18；Harnessed Agentic RL |
| 2026-08-20 | UniReflex | [论文](https://arxiv.org/abs/2608.14372) · [项目页](https://unireflex.github.io/) | 时间回补；v1 2026-08-18；冻结 VLA + 快速力觉反射 |
| 2026-08-20 | Degenerate in Whose Frame? An Equivariance Condition for Degeneracy Detection in LiDAR Registration | [论文](https://arxiv.org/abs/2608.15532) | 时间回补；v1 2026-08-16；坐标等变退化子空间 |
| 2026-08-20 | HP2-SLAM: Adaptive Hybrid ICP for Robust and Efficient LiDAR SLAM | [论文](https://arxiv.org/abs/2608.14996) | 时间回补；v1 2026-08-15；密度/平面性自适应 Hybrid ICP |
| 2026-08-20 | The Normal Distributions Transform: A New Approach to Laser Scan Matching | [IEEE](https://ieeexplore.ieee.org/document/1249285/) · [ndt_omp](https://github.com/koide3/ndt_omp) | 经典论文回顾；IROS 2003；NDT |'''

          for needle in [
              'Hydra-0: Action Flow as a Universal Action Representation for Video World Models',
              'PRISM: A Multi-Modal Industrial Manipulation Dataset',
              'Jetson-ORB-SLAM3',
              'Effector-Centric NMPC for Aerial Manipulation',
              'Agent Lightning v1.0',
              '| UniReflex |',
              'Degenerate in Whose Frame? An Equivariance Condition for Degeneracy Detection in LiDAR Registration',
              'HP2-SLAM: Adaptive Hybrid ICP for Robust and Efficient LiDAR SLAM',
              'The Normal Distributions Transform: A New Approach to Laser Scan Matching',
          ]:
              assert needle not in text, f'duplicate before insert: {needle}'

          marker = '\n## 维护检查表'
          assert marker in text, 'maintenance checklist marker missing'
          text = text.replace(marker, '\n' + rows + '\n' + marker, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/update-robotics-index-2026-08-20.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robotics-brief-covered-items.md .github/workflows/update-robotics-index-2026-08-20.yml
          git commit -m "docs: update robotics brief coverage index for 2026-08-20"
          git push
