name: update-robotics-index-2026-09-03

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-robotics-index-2026-09-03.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update coverage index with optimistic SHA guard
        env:
          EXPECTED_SHA: 1a189308f4109b2481a06ef6711dfd511ed03404
          ENTRIES_B64: 
        run: |
          set -euo pipefail
          current_sha="$(git hash-object robotics-brief-covered-items.md)"
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo "Index SHA changed: expected $EXPECTED_SHA got $current_sha" >&2
            exit 41
          fi
          python - <<'PY'
          import os, base64
          from pathlib import Path
          p = Path('robotics-brief-covered-items.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('> 最后更新：2026-09-02（Asia/Shanghai）', '> 最后更新：2026-09-03（Asia/Shanghai）', 1)
          anchor = '> 2026-09-02 新增 8 条主动态与 1 条经典论文回顾，共 487 条。\n'
          history = '> 2026-09-03 新增 8 条主动态与 1 条经典论文回顾，共 496 条。\n'
          if history not in text:
              if anchor not in text:
                  raise SystemExit('history anchor missing')
              text = text.replace(anchor, anchor + '>\n' + history, 1)
          entries = base64.b64decode(os.environ['ENTRIES_B64']).decode('utf-8')
          marker = '\n## 维护检查表'
          if '| 2026-09-03 | Gemini 3.8 Flash |' not in text:
              if marker not in text:
                  raise SystemExit('maintenance marker missing')
              text = text.replace(marker, '\n\n' + entries + '\n' + marker, 1)
          p.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/update-robotics-index-2026-09-03.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robotics-brief-covered-items.md .github/workflows/update-robotics-index-2026-09-03.yml
          git commit -m "docs: update robotics brief coverage index for 2026-09-03"
          git push
