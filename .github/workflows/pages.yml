name: Update robotics brief coverage index 2026-09-02

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-robotics-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Update coverage index
        env:
          ROWS_B64: ""
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, base64
          path = Path("robotics-brief-covered-items.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("> 最后更新：2026-09-01（Asia/Shanghai）", "> 最后更新：2026-09-02（Asia/Shanghai）")
          old = "> 2026-09-01 新增 8 条主动态与 1 条经典论文回顾，共 478 条。\n"
          new = old + ">\n> 2026-09-02 新增 8 条主动态与 1 条经典论文回顾，共 487 条。\n"
          if "2026-09-02 新增 8 条主动态" not in text:
              if old not in text:
                  raise SystemExit("history anchor missing")
              text = text.replace(old, new, 1)
          rows = base64.b64decode(os.environ["ROWS_B64"]).decode("utf-8")
          if "2608.30690" not in text:
              marker = "## 维护检查表"
              if marker not in text:
                  raise SystemExit("maintenance marker missing")
              text = text.replace(marker, rows + "\n" + marker, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Restore Pages workflow and commit index
        run: |
          git show HEAD^:.github/workflows/pages.yml > .github/workflows/pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robotics-brief-covered-items.md .github/workflows/pages.yml
          git commit -m "docs: update robotics brief coverage index for 2026-09-02"
          git push
