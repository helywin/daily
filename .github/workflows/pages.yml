name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-index:
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore: trigger robotics index update 2026-09-10'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update robotics coverage index and restore workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          index_path = Path('robotics-brief-covered-items.md')
          text = index_path.read_text(encoding='utf-8')

          text = text.replace(
              '> 最后更新：2026-09-09（Asia/Shanghai）',
              '> 最后更新：2026-09-10（Asia/Shanghai）',
              1,
          )

          old_tail = '> 2026-09-09 新增 8 条主动态与 1 条经典论文回顾，共 558 条。\n\n## 已核验条目'
          new_history = '> 2026-09-09 新增 8 条主动态与 1 条经典论文回顾，共 558 条。\n>\n> 2026-09-10 新增 8 条主动态与 1 条经典论文回顾，共 567 条。\n\n## 已核验条目'
          if '> 2026-09-10 新增 8 条主动态与 1 条经典论文回顾，共 567 条。' not in text:
              if old_tail not in text:
                  raise SystemExit('history anchor not found')
              text = text.replace(old_tail, new_history, 1)

          rows = base64.b64decode('').decode('utf-8')
          if '| 2026-09-10 | Functional-SLAM:' not in text:
              marker = '\n## 维护检查表\n'
              if marker not in text:
                  raise SystemExit('maintenance marker not found')
              text = text.replace(marker, '\n' + rows + '\n## 维护检查表\n', 1)

          index_path.write_text(text, encoding='utf-8')

          original_workflow = base64.b64decode('')
          Path('.github/workflows/pages.yml').write_bytes(original_workflow)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robotics-brief-covered-items.md .github/workflows/pages.yml
          git diff --cached --quiet && exit 0
          git commit -m "docs: update robotics brief coverage index for 2026-09-10"
          git push

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
