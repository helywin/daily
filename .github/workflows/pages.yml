name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-robotics-index:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Update robotics brief coverage index
        env:
          ROWS_B64: 
        run: |
          echo "$ROWS_B64" | base64 -d > /tmp/robotics_rows.txt
          python3 -c "from pathlib import Path; p=Path('robotics-brief-covered-items.md'); s=p.read_text(encoding='utf-8'); present='| 2026-09-01 | One year in a forest:' in s; rows=Path('/tmp/robotics_rows.txt').read_text(encoding='utf-8'); s=s if present else s.replace('> 最后更新：2026-08-31（Asia/Shanghai）','> 最后更新：2026-09-01（Asia/Shanghai）',1).replace('> 2026-08-31 新增 8 条主动态与 1 条经典论文回顾，共 469 条。','> 2026-08-31 新增 8 条主动态与 1 条经典论文回顾，共 469 条。\n>\n> 2026-09-01 新增 8 条主动态与 1 条经典论文回顾，共 478 条。',1).replace('\n## 维护检查表','\n'+rows+'\n## 维护检查表',1); p.write_text(s,encoding='utf-8')"
          git checkout HEAD~2 -- .github/workflows/pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robotics-brief-covered-items.md .github/workflows/pages.yml
          if ! git diff --cached --quiet; then
            git commit -m "docs: update robotics brief coverage index for 2026-09-01"
            git push
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
