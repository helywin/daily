name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Update coverage index
        env:
          ROWS_B64: ""
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          p = Path('robotics-brief-covered-items.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('> 最后更新：2026-09-06（Asia/Shanghai）', '> 最后更新：2026-09-07（Asia/Shanghai）', 1)
          if '2026-09-07 新增 8 条主动态与 1 条经典论文回顾，共 532 条。' not in s:
              old = '> 2026-09-06 新增 8 条主动态与 1 条经典论文回顾，共 523 条。\n\n## 已核验条目'
              new = '> 2026-09-06 新增 8 条主动态与 1 条经典论文回顾，共 523 条。\n>\n> 2026-09-07 新增 8 条主动态与 1 条经典论文回顾，共 532 条。\n\n## 已核验条目'
              assert old in s
              s = s.replace(old, new, 1)
          if '| 2026-09-07 | FailBench:' not in s:
              rows = base64.b64decode(__import__('os').environ['ROWS_B64']).decode('utf-8')
              marker = '\n## 维护检查表'
              assert marker in s
              s = s.replace(marker, '\n\n' + rows + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Restore workflow files and commit index
        run: |
          git show HEAD^:.github/workflows/pages.yml > .github/workflows/pages.yml
          rm -f .github/workflows/update-robotics-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robotics-brief-covered-items.md .github/workflows/pages.yml .github/workflows/update-robotics-index.yml
          git commit -m "docs: update robotics brief coverage index for 2026-09-07"
          git push origin master

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
