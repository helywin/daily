name: update robotics index 2026-09-05

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-robotics-index-2026-09-05.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Update coverage index
        shell: bash
        run: |
          python -c 'from pathlib import Path; import base64; p=Path("robotics-brief-covered-items.md"); s=p.read_text(); old="> 最后更新：2026-09-04（Asia/Shanghai）"; new="> 最后更新：2026-09-05（Asia/Shanghai）"; anchor="> 2026-09-04 新增 8 条主动态与 1 条经典论文回顾，共 505 条。"; count=anchor+"\n>\n> 2026-09-05 新增 8 条主动态与 1 条经典论文回顾，共 514 条。"; rows=base64.b64decode("://arxiv.org/abs/2609.03276) · [项目页](https://r2s-eval.github.io/) | 时间回补；Real-to-Sim 校准 + VLM preference policy ranking |
| 2026-09-05 | WISE: World-model-guided Imagination Scheduling for Efficient Post-training of Vision-Language-Action Models | [论文](https://arxiv.org/abs/2609.03681) | 时间回补；按需 bounded imagination；GPU computation 约降 80% |
| 2026-09-05 | Requirements After the First Edit: Mining Late Requirement Emergence and Rework in Real-World Coding-Agent Sessions | [论文](https://arxiv.org/abs/2609.03028) | 时间回补；3,553 SWE-chat sessions；late requirement 与约 2× code invalidation |
| 2026-09-05 | Formalizing Fermat's Last Theorem with Claude | [官方研究](https://www.anthropic.com/research/formalizing-fermats-last-theorem) · [Lean 证明](https://github.com/anthropics/fermats-last-theorem) | 2026-09-04 官方更新；11 天多 Agent + Prove2Me DAG + Lean/nanoda 独立验证 |
| 2026-09-05 | Object Modeling by Registration of Multiple Range Images / Chen–Medioni Point-to-Plane Registration | [ICRA 论文](https://graphics.stanford.edu/~smr/ICP/comparison/chen-medioni-align-rob91.pdf) · [DOI](https://doi.org/10.1016/0262-8856(92)90066-C) | 经典论文回顾；ICRA 1991 / Image and Vision Computing 1992；point-to-plane registration |".encode()).decode(); marker="\n## 维护检查表"; assert old in s; assert anchor in s; assert marker in s; assert "2609.03561" not in s; s=s.replace(old,new,1).replace(anchor,count,1).replace(marker,"\n"+rows+"\n"+marker,1); p.write_text(s)'
          rm .github/workflows/update-robotics-index-2026-09-05.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robotics-brief-covered-items.md .github/workflows/update-robotics-index-2026-09-05.yml
          git commit -m "docs: update robotics brief coverage index for 2026-09-05"
          git push origin master
