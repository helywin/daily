name: One-off update robotics brief index
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-robotics-index.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update index
        env:
          ADDITIONS_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('robotics-brief-covered-items.md')
          s = p.read_text()
          old = '> 2026-09-07 新增 8 条主动态与 1 条经典论文回顾，共 532 条。'
          new = '> 2026-09-07 早间首版新增 8 条主动态与 1 条经典论文回顾，共 532 条；09:57 因 arXiv Robotics 9 月 7 日最新公开批次刷新，更新同日文章并追加 8 条主动态，累计共 540 条。早间首版条目保留为历史覆盖记录。'
          assert old in s
          s = s.replace(old, new, 1)
          add = base64.b64decode(os.environ['ADDITIONS_B64']).decode()
          marker = '\n## 维护检查表'
          assert marker in s
          if '2609.05325' not in s:
              s = s.replace(marker, '\n' + add + '\n' + marker, 1)
          p.write_text(s)
          PY
          rm .github/workflows/update-robotics-index.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add robotics-brief-covered-items.md .github/workflows/update-robotics-index.yml
          git commit -m 'docs: update robotics brief coverage index for 2026-09-07'
          git push
