name: Update community AI coding tips for 2026-09-14

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-community-brief-2026-09-14.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch files
        run: python .github/scripts/update-community-brief-2026-09-14.py

      - name: Commit spec
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- robotics-brief-task-spec.md; then
            git add robotics-brief-task-spec.md
            git commit -m "docs: add community AI coding tips section to robotics brief spec"
          fi

      - name: Commit article
        run: |
          if ! git diff --quiet -- _posts/2026-09-14-robotics-brief.md; then
            git add _posts/2026-09-14-robotics-brief.md
            git commit -m "docs: update robotics brief for 2026-09-14"
          fi

      - name: Commit coverage index
        run: |
          if ! git diff --quiet -- robotics-brief-covered-items.md; then
            git add robotics-brief-covered-items.md
            git commit -m "docs: update robotics brief coverage index for 2026-09-14"
          fi

      - name: Remove temporary updater files
        run: |
          rm -f .github/workflows/update-community-brief-2026-09-14.yml
          rm -f .github/scripts/update-community-brief-2026-09-14.py
          git add -A
          git commit -m "chore: remove temporary community brief updater"

      - name: Push all commits
        run: git push origin HEAD:master
