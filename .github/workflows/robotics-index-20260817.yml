name: robotics-index-20260817

on:
  push:
    paths:
      - .github/workflows/robotics-index-20260817.yml

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Update robotics brief coverage index
        shell: python
        run: |
          from pathlib import Path
          p = Path('robotics-brief-covered-items.md')
          s = p.read_text(encoding='utf-8')
          old = '> 最后更新：2026-08-16（Asia/Shanghai）'
          new = '> 最后更新：2026-08-17（Asia/Shanghai）'
          if old not in s:
              raise SystemExit('expected last-updated header not found')
          s = s.replace(old, new, 1)
          anchor = '> 2026-08-16 新增 8 条主动态与 1 条经典论文回顾，共 334 条。'
          note = anchor + '\n>\n> 2026-08-17 新增 8 条主动态与 1 条经典论文回顾，共 343 条。'
          if anchor not in s:
              raise SystemExit('expected count anchor not found')
          s = s.replace(anchor, note, 1)
          rows = '''| 2026-08-17 | Detection and Ranging of Transient Extrinsic Contacts Based on 6D Dynamic Tactile Sensing / TECDAR | [论文](https://arxiv.org/abs/2608.07075) · [项目页](https://humitlab.github.io/TECDAR/) | 时间回补；7 kHz 6D 动态触觉与外部接触定位 |\n| 2026-08-17 | CrossTracer: Cross-Embodiment Navigation via VLA Model Reasoning and Trace Residuals Adapting | [论文](https://arxiv.org/abs/2608.06688) | 时间回补；统一像素轨迹 + 本体残差适配 |\n| 2026-08-17 | R2S-EGO: Dual-Proxy Refinement for Sparse-Capture Real-to-Sim | [论文](https://arxiv.org/abs/2608.06827) | 时间回补；稀疏客户现场采集与行为相关 Real-to-Sim |\n| 2026-08-17 | AtlasVLA: Persistent World-Ego State Modeling for Vision-Language-Action Models | [论文](https://arxiv.org/abs/2608.06729) | 时间回补；持久 World-Ego 双记忆 VLA |\n| 2026-08-17 | Representation Handoffs for OpenArm-Based Laboratory Mobile Manipulation | [论文](https://arxiv.org/abs/2608.07154) | 时间回补；移动操作 representation handoff 与技能接口 |\n| 2026-08-17 | Benchmarking and Reasoning Distillation of Large Language Models for Feedback Controller Design in Complex Dynamical Systems / CoDyControlBench | [论文](https://arxiv.org/abs/2608.07004) | 时间回补；控制器设计 benchmark 与 1.5B reasoning distillation |\n| 2026-08-17 | Online Monitoring and Corrective Steering of Programming Agents / LivePlan | [论文](https://arxiv.org/abs/2608.06701) | 时间回补；Coding Agent 确定性运行时监控与按需 Advisor |\n| 2026-08-17 | Characterizing the Quality Profile of AI-Generated C++ in Production | [论文](https://arxiv.org/abs/2608.06640) | 时间回补；352 万生产变更、AI C++ 质量与性能画像 |\n| 2026-08-17 | Generalized-ICP | [RSS](https://roboticsproceedings.org/rss05/p21.html) · [原始代码](https://github.com/avsegal/gicp) · [现代实现](https://github.com/koide3/small_gicp) | 经典论文回顾 |\n'''
          maint = '\n## 维护检查表\n'
          if maint not in s:
              raise SystemExit('maintenance checklist anchor not found')
          if '2026-08-17 | Detection and Ranging of Transient Extrinsic Contacts' in s:
              raise SystemExit('2026-08-17 rows already present')
          s = s.replace(maint, '\n' + rows + maint, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify and commit
        run: |
          grep -q '> 最后更新：2026-08-17（Asia/Shanghai）' robotics-brief-covered-items.md
          grep -q '2026-08-17 | Generalized-ICP' robotics-brief-covered-items.md
          grep -q '^## 维护检查表' robotics-brief-covered-items.md
          git config user.name 'robotics-brief-bot'
          git config user.email 'robotics-brief-bot@users.noreply.github.com'
          git add robotics-brief-covered-items.md
          git rm .github/workflows/robotics-index-20260817.yml
          git commit -m 'docs: update robotics brief coverage index for 2026-08-17'
          git push origin HEAD:master
